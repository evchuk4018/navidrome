# Standalone Navidrome deployment. This file is intentionally independent of
# the retired MusicPlayer application and builds from this repository.
services:
  navidrome:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: final
      args:
        GIT_SHA: ${GIT_SHA:-}
        GIT_TAG: ${GIT_TAG:-}
    image: home-music-navidrome:local
    restart: unless-stopped
    environment:
      ND_BASEURL: /navidrome
      ND_DEVAUTOLOGINUSERNAME: admin
      ND_LASTFM_ENABLED: ${ND_LASTFM_ENABLED:-false}
      ND_LASTFM_APIKEY: ${ND_LASTFM_APIKEY:-}
      ND_LASTFM_SECRET: ${ND_LASTFM_SECRET:-}
    ports:
      - "127.0.0.1:4533:4533"
    volumes:
      - type: bind
        source: /srv/storage/media/music
        target: /music
        # External music downloads are imported into the canonical library.
        read_only: false
      - type: volume
        source: navidrome_data
        target: /data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4533/ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  navidrome_data:
    # Preserve the existing Navidrome database and application state.
    external: true
    name: musicplayer_navidrome_data
